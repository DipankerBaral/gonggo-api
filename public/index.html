<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GongGo: pickup games around Wollongong</title>
  <meta name="description" content="Find a pickup game around Wollongong and grab a spot.">
  <meta name="theme-color" content="#0A6A78">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h32L0 32z' fill='%23CF3A2E'/%3E%3Cpath d='M32 0v32H0z' fill='%23F2C230'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/fonts/barlow-condensed/600.css">
  <link rel="stylesheet" href="/vendor/fonts/barlow-condensed/700.css">
  <link rel="stylesheet" href="/vendor/fonts/atkinson-hyperlegible/400.css">
  <link rel="stylesheet" href="/vendor/fonts/atkinson-hyperlegible/700.css">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="wordmark" aria-label="GongGo home">
      <span class="flag" aria-hidden="true"></span>GongGo
    </a>
    <nav class="view-toggle" aria-label="Choose view">
      <a href="#/" data-view="list">List</a>
      <a href="#/map" data-view="map">Map</a>
    </nav>
    <div class="account" id="account" hidden>
      <button type="button" class="me account-button" id="account-button" aria-expanded="false" aria-controls="account-menu">
        <span id="account-name"></span><span class="caret" aria-hidden="true"></span>
      </button>
      <div class="account-menu" id="account-menu" hidden>
        <a href="#/me" data-view="me">My games</a>
        <button type="button" id="menu-rename">Change name</button>
        <button type="button" id="menu-sign-out">Sign out</button>
      </div>
    </div>
    <button type="button" class="me sign-in-button" id="sign-in-button" hidden>Sign in</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <a href="#/new" class="post-button" id="post-button">Post a game</a>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="signin-dialog" aria-labelledby="signin-title">
    <h2 id="signin-title">Sign in</h2>
    <p>Anyone can browse games. Sign in to join, post and comment.</p>
    <div id="signin-options"></div>
    <div class="dialog-actions">
      <button type="button" class="button quiet" id="signin-cancel">Not now</button>
    </div>
  </dialog>

  <dialog id="name-dialog" aria-labelledby="name-title">
    <form method="dialog" id="name-form">
      <h2 id="name-title">What should other players call you?</h2>
      <p>Your first name is enough. Hosts and players see it.</p>
      <label for="name-input">First name</label>
      <input id="name-input" name="name" autocomplete="given-name" required maxlength="30" aria-describedby="name-error">
      <p id="name-error" class="field-error" hidden>Use letters, like Sam or Priya.</p>
      <div class="dialog-actions">
        <button type="button" class="button quiet" id="name-cancel">Not now</button>
        <button type="submit" class="button">Save name</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
