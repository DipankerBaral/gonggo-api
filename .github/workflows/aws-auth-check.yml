name: AWS auth check

# Run by hand from the Actions tab to prove GitHub can log in to AWS via OIDC.
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request an OIDC token from GitHub
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      # Prints the token's identity claims (never the token itself), so a
      # trust-policy mismatch is easy to spot if login ever fails again
      - name: Show OIDC token claims (for troubleshooting)
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.notice(`sub: ${claims.sub}`);
            core.notice(`aud: ${claims.aud}`);
            core.notice(`repository: ${claims.repository}`);

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Who am I?
        run: aws sts get-caller-identity

      # list-objects-v2 returns a count (0 when empty) instead of failing,
      # so this checks access to the bucket rather than whether state exists yet
      - name: Can I read the Terraform state bucket?
        run: aws s3api list-objects-v2 --bucket gonggo-tfstate-477554785759 --prefix infra/ --query 'KeyCount'