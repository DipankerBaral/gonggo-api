name: CI

# When to run: every push to main, and every pull request
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button, e.g. to redeploy after turning deploys on

# On pull requests, a new push cancels the older run. On main we never cancel,
# because stopping a deploy halfway through could leave AWS half-updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

jobs:
  # Job 1: run the tests against the code directly, with Postgres as a service
  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GitHub starts this Postgres container before the steps run
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gonggo
          POSTGRES_PASSWORD: gonggo
          POSTGRES_DB: gonggo
        ports:
          - 5433:5432   # same port as local, so the default DATABASE_URL just works
        options: >-
          --health-cmd "pg_isready -U gonggo -d gonggo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm        # reuse downloaded packages between runs

      - name: Install dependencies
        run: npm ci         # like npm install, but exact versions from the lockfile

      - name: Run Playwright API tests
        run: npm test
        env:
          ADMIN_KEY: ci-admin-key

      - name: Upload test report
        if: ${{ !cancelled() }}   # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Job 2: build the real Docker image, run the full stack, test it
  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test             # only bother if the tests passed
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Build and start the stack
        run: docker compose up -d --build --wait   # --wait blocks until both containers are healthy
        env:
          ADMIN_KEY: ci-admin-key
          SEED: 'false'

      - name: Run tests against the containers
        run: npm test
        env:
          BASE_URL: http://localhost:3000
          ADMIN_KEY: ci-admin-key

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  # Job 3: publish the image to GitHub Container Registry (ghcr.io)
  # Only for pushes to main: pull requests are tested but never published.
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker           # only publish an image that passed the smoke test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    # This job needs more than read access: it writes a package to GHCR.
    # The permission is granted to this job only, not the whole workflow.
    permissions:
      contents: read
      packages: write

    env:
      # Registry image names must be lowercase
      IMAGE: ghcr.io/dipankerbaral/gonggo-api

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # a temporary token GitHub creates for each run

      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Two tags for every image:
          #   sha-abc1234 -> exactly this commit, never changes (what we'll deploy)
          #   latest      -> whatever is newest on main (handy for trying it out)
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # links the package to this repo on GitHub
          cache-from: type=gha                       # reuse layers from earlier runs
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 4: deploy to AWS. Takes the exact image that passed every test (from
  # GHCR), copies it into ECR, then runs Terraform with that image tag.
  # Only runs when the repo variable DEPLOY_ENABLED is 'true', so you can
  # switch deploys off while the infrastructure is destroyed.
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    timeout-minutes: 30

    # Only one deploy at a time, and never cancel one that has started
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read    # pull the tested image from GHCR
      id-token: write   # OIDC login to AWS

    env:
      AWS_REGION: ap-southeast-2
      GHCR_IMAGE: ghcr.io/dipankerbaral/gonggo-api

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Work out the image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"   # same 7-character sha the publish job used

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GHCR and ECR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ECR_REPO=$(aws ecr describe-repositories --repository-names gonggo-api --query 'repositories[0].repositoryUri' --output text)
          echo "ECR_REPO=$ECR_REPO" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      # Build once, deploy many: we don't rebuild. We copy the image that
      # already passed the tests, so what runs in AWS is exactly what was tested.
      - name: Copy the tested image into ECR
        run: |
          if aws ecr describe-images --repository-name gonggo-api --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG is already in ECR (a re-run), skipping the push"
          else
            docker pull "$GHCR_IMAGE:sha-$TAG"
            docker tag "$GHCR_IMAGE:sha-$TAG" "$ECR_REPO:$TAG"
            docker push "$ECR_REPO:$TAG"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # plain output, so terraform output -raw works in scripts

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        run: |
          set -o pipefail   # without this, a failed plan would be hidden by tee
          terraform -chdir=infra plan -input=false -no-color -var="image_tag=$TAG" -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false tfplan   # applies exactly the plan above

      - name: Wait for ECS to finish rolling out
        run: |
          CLUSTER=$(terraform -chdir=infra output -raw ecs_cluster)
          SERVICE=$(terraform -chdir=infra output -raw ecs_service)
          EXPECTED=$(terraform -chdir=infra output -raw task_definition_arn)

          echo "Waiting for $SERVICE to become stable..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

          # "Stable" can also mean ECS rolled BACK to the old version after the
          # new one failed its health checks. Make sure the new version won.
          read -r RUNNING STATE < <(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition,rolloutState]' --output text)
          echo "Running: $RUNNING ($STATE)"
          echo "Expected: $EXPECTED"
          if [ "$RUNNING" != "$EXPECTED" ] || [ "$STATE" != "COMPLETED" ]; then
            echo "::error::The new version did not become healthy. ECS rolled back to the previous version. Check the logs in CloudWatch."
            exit 1
          fi

      - name: Smoke test the live app
        run: |
          URL=$(terraform -chdir=infra output -raw app_url)
          for i in $(seq 1 10); do
            if curl -fsS "$URL/health"; then echo; break; fi
            echo "Not ready yet (attempt $i/10), retrying..."; sleep 10
            [ "$i" = 10 ] && exit 1
          done
          curl -fsS "$URL/games" > /dev/null
          {
            echo "### Deployed \`$TAG\`"
            echo "$URL/games"
          } >> "$GITHUB_STEP_SUMMARY"
