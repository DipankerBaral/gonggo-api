name: Destroy AWS infrastructure

# Run by hand from the Actions tab to tear down the app and stop all running
# costs. Your images (in ECR) and the state bucket are kept, so the next deploy
# brings everything back. Remember to set DEPLOY_ENABLED to false afterwards.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production   # never runs at the same time as a deploy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    timeout-minutes: 60 # deleting CloudFront and the database each take a while
    steps:
      - name: Refuse while real data is protected
        run: |
          if [ "${{ vars.PROTECT_DATA }}" != "false" ]; then
            echo "::error::Data protection is on, so the database and accounts can't be deleted. To tear everything down on purpose: set the repo variable PROTECT_DATA to false, run CI once so protection is switched off, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform destroy
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra destroy -input=false -auto-approve -var="image_tag=unused" -var="protect_data=false"
